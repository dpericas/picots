<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gala – Projector</title>
  <link rel="stylesheet" href="/static/screen/screen.css">
</head>
<body>
  <div id="stage">
    <div id="videos"></div>
    <div id="slides" class="layer hidden"><img id="slide-a" alt=""><img id="slide-b" alt=""></div>
    <div id="hold" class="layer hidden"><div id="hold-text"></div></div>
    <div id="parade" class="layer hidden">
      <div class="parade-intro"><h1 class="parade-intro-text"></h1></div>
      <div class="parade-stage"></div>
      <div class="parade-mosaic hidden"><h1 class="parade-final-text"></h1><div class="parade-grid"></div></div>
      <div class="parade-banner hidden"></div>
      <div class="parade-burst"></div>
      <audio preload="auto"></audio>
    </div>
    <div id="vote" class="layer hidden">
      <h1 id="vote-question"></h1>
      <div id="vote-options"></div>
      <div id="vote-footer">
        <div id="vote-timer"></div>
        <div id="vote-voters"></div>
        <img id="vote-qr" alt="">
      </div>
    </div>
    <div id="quiz" class="layer hidden">
      <div id="quiz-intro"><h1 id="quiz-intro-title"></h1><p id="quiz-intro-text"></p></div>
      <div id="quiz-play" class="hidden">
        <div id="quiz-top"><span id="quiz-num"></span><span id="quiz-answered"></span></div>
        <h1 id="quiz-question"></h1>
        <div id="quiz-middle">
          <div id="quiz-timer"></div>
          <img id="quiz-image" alt="" class="hidden">
          <ol id="quiz-board" class="hidden"></ol>
        </div>
        <div id="quiz-options"></div>
        <div id="quiz-voters"></div>
      </div>
      <div id="quiz-ranking" class="hidden">
        <h1 id="quiz-ranking-title"></h1>
        <div id="quiz-podium"></div>
        <ol id="quiz-rest"></ol>
      </div>
      <div class="burst"></div>
    </div>
    <div id="challenge" class="layer hidden">
      <h1 id="ch-text"></h1>
      <div id="ch-lock">🔒</div>
      <div id="ch-count"></div>
      <div id="ch-progress"><div id="ch-bar"></div></div>
      <div id="ch-footer"><div id="ch-timer"></div><div id="ch-players"></div></div>
      <div id="ch-result" class="hidden"></div>
      <div class="burst"></div>
    </div>
    <div id="wall" class="layer hidden">
      <div id="wall-head"><h1 id="wall-text"></h1><img id="wall-qr" alt=""></div>
      <div id="wall-grid"></div>
      <p id="wall-empty">Els missatges apareixeran aquí ✨</p>
    </div>
    <div id="welcome" class="layer">
      <h1 id="welcome-title"></h1>
      <img id="welcome-qr" alt="">
      <p id="welcome-url"></p>
    </div>
    <audio id="music" loop preload="auto"></audio>
  </div>
  <div id="overlay-hold" class="overlay hidden"><div class="hold-logo"></div></div>
  <div id="overlay-black" class="overlay hidden"></div>
  <div id="offline" class="hidden" title="Sense connexió amb el servidor"></div>
  <div id="caption" class="hidden"></div>
  <div id="rehearsal-tag" class="hidden">ASSAIG</div>
  <div id="test-pattern" class="hidden">
    <div class="tp-grid"></div>
    <div class="tp-circle"></div>
    <div class="tp-info"><div class="tp-title">PANTALLA DEL PROJECTOR</div><div id="tp-res"></div></div>
    <div class="tp-bars"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </div>
  <div id="sound-hint" class="hidden">Clica per activar el so</div>
  <script src="/static/common/client.js"></script>
  <script src="/static/screen/deck.js"></script>
  <script src="/static/screen/parade.js"></script>
  <script src="/static/screen/screen.js"></script>
</body>
</html>
