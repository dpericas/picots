cues:
  # ---------------------------------------------------------------- 17:05
  - id: entrada
    tipus: entrada
    titol: Entrada triomfal
    text: "Benvinguts, Picots!"
    text_final: "Ja hi som tots!"
    efecte: media/so/entrada.mp3
    guio: "Digues el nom en veu alta i prem GO. Deixa que acabi el vídeo i l'aplaudiment abans del següent."
    notes: "Els nens entren per la catifa. Un mestre els fa entrar un a un des de la porta."

  # ---------------------------------------------------------------- 17:25
  - id: benvinguda
    tipus: espera
    titol: Benvinguda i QR
    text: "La missió secreta està a punt de començar…"
    musica: media/musica/espera.mp3
    durada_estimada: "5:00"
    guio: "Benvinguts a la gala! Avui teniu una missió secreta. Ara us donarem una targeta: escanegeu el QR amb el mòbil o la tauleta i sortirà el vostre nom."
    notes: "Repartir les targetes QR. Al panell, comprovar que surten tots en verd (MÒBILS 23/23)."

  # ---------------------------------------------------------------- 17:30
  - id: homenatge
    tipus: video
    titol: Homenatge als professors
    fitxer: media/video/homenatge.mp4
    guio: "Abans de començar la missió, les famílies tenen un missatge per a algú molt especial…"
    notes: "Vídeo amb els missatges de les famílies. Després, entrega dels detalls als professors (cue següent)."

  - id: regals
    tipus: espera
    titol: Entrega als professors
    text: "Gràcies, profes! 💛"
    musica: media/musica/regals.mp3
    durada_estimada: "8:00"
    guio: "Demanem als professors que pugin a l'escenari…"

