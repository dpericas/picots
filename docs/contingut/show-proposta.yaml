    titol: "Votació 1 – Per on entrem al bosc?"
    pregunta: "Per on entrem al Bosc dels Anys?"
    temps: 30
    empat: aleatori
    per_defecte: 0
    guio: "Ara decidiu vosaltres! Mireu el mòbil. GO per obrir la votació; quan s'acabi el temps, GO per seguir el camí guanyador."
    opcions:
      - { text: "Pel Túnel de les Pintures", va_a: cap2a }
