# Proposta de guió: «La missió secreta dels Picots» (vegeu docs/contingut/guio-conte.md).
# Cada curs és una «pàgina»: el vídeo del seu guardià (el professor/a d'aquell curs
# s'acomiada i explica una anècdota) i les fotos d'aquell curs.
# Per fer-lo servir: copia'l a show/show.yaml, canvia els noms i els ids dels nens (sense
# espais, p. ex. "marti"), omple les mencions i ves posant els fitxers a show/media/.
# Les durades estimades de les parts en directe (benvinguda, homenatge…) són orientatives:
# ajusta-les després del primer assaig amb els temps reals del panell.

