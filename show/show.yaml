# Guió de la gala. Les rutes són relatives a aquesta carpeta.
# Després d'editar-lo, clica «Recarregar guió» al panell (no cal reiniciar).
#
# Tipus de cue:
#   video        fitxer, auto (true = passa sol a la següent en acabar),
#                fos (segons de fos encadenat en entrar; 0 = tall net, per defecte)
#   diapositives carpeta i/o imatges, segons (per foto), musica
#   votacio      pregunta, opcions [{text, va_a}], temps (s, 0 = sense límit),
#                empat (aleatori | primera | operador), per_defecte (opció si ningú vota)
#   espera       text, musica
#   entrada      entrada triomfal: GO passa nen a nen (foto + nom), i al final mosaic amb tots.
#                text (pantalla inicial), text_final (sobre el mosaic), musica (de fons, en bucle),
#                efecte (so curt a cada nen sense vídeo), ordre (llista d'ids; per defecte, tots),
#                nom_sobre_video (true per defecte: el nom surt a sota mentre sona el vídeo del nen)
#   questionari  preguntes tipus Kahoot: preguntes [{pregunta, opcions (2-4), correcta (A, B, C, D),
#                temps, imatge}], temps (per defecte de cada pregunta, 20 s), text (pantalla inicial),
#                classificacio (quants en surten a la classificació, 5; 0 = sense punts a la pantalla),
#                tancar_quan_tots (true: quan han respost tots es passa a la solució), musica.
#                GO per cada pregunta: es llegeix -> resposta oberta -> solució; al final, classificació.
#   repte        repte col·lectiu: modalitat (tocs = toquen el mòbil fins a l'objectiu; tots = cal que
#                premin tots els que tenen mòbil), objectiu (tocs entre tots), temps (s),
#                si_exit (cue si el superen, obligatori), si_no (si no; per defecte la de sota), text, musica.
#   mencions     diplomes: GO passa nen a nen (foto, nom i menció) i al final mosaic. La menció surt de
#                "mencio" de cada participant o de mencions: {id: text} de la cue. text, text_final,
#                musica, efecte, ordre (com l'entrada).
#   mur          mur de missatges i dibuixos des dels mòbils. text (consigna), moderacio (true: el tècnic
#                aprova cada missatge abans que surti), dibuixos (true), maxim_per_nen (3), musica.
# Comuns: id (obligatori), titol, seguent (si no, la de sota), notes (només al panell del tècnic),
#         guio (el que ha de dir el presentador: surt al seu comandament)

titol: Gala Picots 2027

xarxa:
  port: 8080
  # ip_publica: 192.168.50.10   # força l'adreça dels QR si n'hi ha més d'una
  # pin_control: "4321"         # permet obrir /control des d'un altre aparell: /control?pin=4321
  pin_presentador: "2027"       # PIN del comandament del presentador (/remote al seu mòbil)

# foto: foto actual per a l'entrada triomfal (vertical 3:4, la cara al terç superior).
# video_entrada: resum del seu pas per l'escola (amb la seva música integrada). A l'entrada
#   triomfal es reprodueix amb el nom a sobre i, en acabar, surt la targeta amb la foto.
# avatar: dibuix del personatge del conte (votacions). Si no hi ha foto, s'usa l'avatar.
# mencio: el text del diploma (cue de tipus mencions).
participants:
  - { id: anna,   nom: Anna,   foto: media/fotos/anna.jpg,  video_entrada: media/entrada/anna.mp4,  mencio: "La rialla més contagiosa" }
  - { id: biel,   nom: Biel,   foto: media/fotos/biel.jpg,  video_entrada: media/entrada/biel.mp4,  mencio: "L'inventor de jocs" }
  - { id: carla,  nom: Carla,  foto: media/fotos/carla.jpg, video_entrada: media/entrada/carla.mp4, mencio: "La millor companya" }
  - { id: dani,   nom: Dani,   foto: media/fotos/dani.jpg,  video_entrada: media/entrada/dani.mp4,  mencio: "El més curiós" }
  - { id: emma,   nom: Emma,   foto: media/fotos/emma.jpg,  mencio: "L'artista de la classe" }
  - { id: ferran, nom: Ferran, foto: media/fotos/ferran.jpg, mencio: "El cor més gran" }

cues:
  - id: entrada
    tipus: entrada
    titol: Entrada triomfal
    text: "Benvinguts, Picots!"
    text_final: "Ja hi som tots!"
    efecte: media/so/entrada.mp3
    # musica: media/musica/entrada.mp3
    # ordre: [anna, biel, carla, dani, emma, ferran]
    notes: "Els nens entren per la catifa quan el presentador diu el nom. GO just quan comença a dir-lo."
    guio: "Digues el nom en veu alta i prem GO. Espera que acabi el vídeo i l'aplaudiment abans del següent."

  - id: benvinguda
    tipus: espera
    titol: Benvinguda
    text: "La missió secreta està a punt de començar…"
    guio: "Benvinguts! Repartim els codis QR: escanegeu-lo i trieu el vostre nom. Quan tothom estigui a punt, GO."
    notes: "El presentador reparteix els QR. Esperar que tothom estigui connectat."

  - id: cap1
    tipus: video
    titol: "Capítol 1 – La carta misteriosa"
    fitxer: media/video/cap1.mp4
    auto: true

  - id: vot1
    tipus: votacio
    titol: "Votació 1 – Quina porta?"
    pregunta: "Quina porta obrim?"
    temps: 30
    guio: "Ara decidiu vosaltres! GO per obrir la votació; quan s'acabi el temps, GO per veure on anem."
    empat: aleatori
    per_defecte: 0
    opcions:
      - { text: "Porta del bosc", va_a: cap2a }
      - { text: "Porta del castell", va_a: cap2b }

  - id: cap2a
    tipus: video
    titol: "Capítol 2A – El bosc"
    fitxer: media/video/cap2a.mp4
    auto: true
    seguent: cap3

  - id: cap2b
    tipus: video
    titol: "Capítol 2B – El castell"
    fitxer: media/video/cap2b.mp4
    auto: true
    seguent: cap3

  - id: cap3
    tipus: video
    titol: "Capítol 3 – El tresor"
    fitxer: media/video/cap3.mp4
    fos: 0.8
    notes: "Entra amb fos encadenat des del capítol 2."

  - id: quiz1
    tipus: questionari
    titol: "Qüestionari – Qui se'n recorda?"
    text: "Quant recordeu de l'escola?"
    temps: 20
    classificacio: 5
    guio: "Llegeix la pregunta en veu alta i prem GO per deixar respondre. A la solució, comenta qui l'ha encertada."
    preguntes:
      - pregunta: "On vam anar de colònies a P5?"
        opcions: ["A la granja", "A la platja", "A la muntanya", "Al castell"]
        correcta: A
        imatge: media/records/P3/foto01.jpg
      - pregunta: "Com es deia la mascota de la classe?"
        opcions: ["Pipo", "Lola", "Tito"]
        correcta: C
      - pregunta: "Quants anys fa que anem junts a l'escola?"
        opcions: ["3", "6", "9", "12"]
        correcta: C
        temps: 15

  - id: records
    tipus: diapositives
    titol: "Records de P3"
    carpeta: media/records/P3
    segons: 3

  - id: vot2
    tipus: votacio
    titol: "Votació final – La cançó de la festa"
    pregunta: "Amb quina cançó comencem la festa?"
    temps: 20
    empat: operador
    opcions:
      - { text: "Cançó 1", va_a: repte }
      - { text: "Cançó 2", va_a: repte }
      - { text: "Cançó 3", va_a: repte }

  - id: repte
    tipus: repte
    titol: "Repte – Obrim el cofre!"
    text: "Toqueu el botó tan ràpid com pugueu per obrir el cofre!"
    modalitat: tocs
    objectiu: 300
    temps: 20
    si_exit: extra
    si_no: final
    guio: "Tots junts! Quan premis GO comença el compte enrere: que toquin el botó tan ràpid com puguin."
    notes: "Amb 23 nens, 300 tocs en 20 s és assequible. Si fallen els mòbils: aplaudiments i «Superat»."

  - id: extra
    tipus: espera
    titol: "Escena extra desbloquejada"
    text: "🔓 Heu desbloquejat l'escena secreta!"
    seguent: final

  - id: final
    tipus: video
    titol: "Final desbloquejat"
    fitxer: media/video/final.mp4

  - id: diplomes
    tipus: mencions
    titol: "Entrega de diplomes"
    text: "Entrega de diplomes"
    text_final: "Felicitats, Picots!"
    efecte: media/so/entrada.mp3
    guio: "Digues el nom i la menció; el nen surt a recollir el diploma. GO per al següent."

  - id: mur
    tipus: mur
    titol: "Mur de missatges"
    text: "Envieu un missatge o un dibuix als profes! 💌"
    moderacio: true
    maxim_per_nen: 3
    guio: "Ara podeu enviar un missatge o un dibuix als profes des del mòbil!"
    notes: "Aprova els missatges al panell (MUR). Només surten a la pantalla els aprovats."

  - id: fi
    tipus: espera
    titol: Fi
    text: "Moltes gràcies a tots! 🎉"
